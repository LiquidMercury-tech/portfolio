<style>
  /* Ensure the container relative positioning and transition */
.gallery-item {
  position: relative;
  overflow: hidden; /* Keeps things neat before hover */
  transition: all 0.3s ease-in-out;
}

/* Base image styling */
.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* Standard cropped layout in normal view */
  display: block;
  transition: transform 0.4s ease, object-fit 0.3s ease, opacity 0.3s ease;
}

/* Base label transition */
.gallery-item .gallery-item__label {
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

/* ==========================================
   HOVER STATES: Full uncropped image focus
   ========================================== */

/* 1. Switch to 'contain' so the image reveals 100% of itself without clipping */
.gallery-item:hover img {
  object-fit: contain; 
  transform: scale(1.1); /* Enlarge smoothly outwards */
  background-color: rgba(0, 0, 0, 0.85); /* Optional dark backdrop to pop the full photo */
}

/* 2. Hide the label on hover so ONLY the image is visible */
.gallery-item:hover .gallery-item__label {
  opacity: 0;
  visibility: hidden;
}
</style>
</head>
